name: Release Windows executable

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate version, test and build
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Release tags must use vx.y.z.' }
          .\build.ps1 -Version $env:RELEASE_TAG
      - name: Package executable and checksum
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $name = "DemonicMahjongSaveEditor-$($env:RELEASE_TAG)-windows-amd64.zip"
          $zip = Join-Path dist $name
          Compress-Archive -Path bin/DemonicMahjongSaveEditor.exe,bin/THIRD_PARTY_NOTICES.txt,README.md,LICENSE,NOTICE.md -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $pwd 'dist/SHA256SUMS.txt'), "$hash  $name`n", [System.Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-amd64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-windows-amd64
          path: dist
      - name: Publish release after all assets upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $zip = "dist/DemonicMahjongSaveEditor-$($env:RELEASE_TAG)-windows-amd64.zip"
          gh release create $env:RELEASE_TAG $zip dist/SHA256SUMS.txt --verify-tag --draft --title "$env:RELEASE_TAG" --notes-file .github/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release creation or asset upload failed; no existing release is overwritten.' }
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release remains a draft because publishing failed.' }
